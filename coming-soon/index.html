<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f4f1ea" />
    <title>Coming Soon</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f4f1ea;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(circle at 20% 20%, #ffffff 0, transparent 32rem),
          #f4f1ea;
      }

      main {
        width: min(42rem, 100%);
        padding: clamp(2rem, 6vw, 4.5rem);
        border: 1px solid rgba(23, 32, 51, 0.15);
        border-radius: 1.5rem;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 1.5rem 4rem rgba(23, 32, 51, 0.08);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 1.25rem;
        color: #526078;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3rem, 10vw, 6rem);
        font-weight: 500;
        letter-spacing: -0.055em;
        line-height: 0.95;
      }

      .message {
        max-width: 30rem;
        margin: 1.75rem auto 0;
        color: #526078;
        font-size: clamp(1rem, 2vw, 1.125rem);
        line-height: 1.7;
      }

      .message + .message {
        margin-top: 0.4rem;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #111722;
          color: #f4f1ea;
        }

        body {
          background:
            radial-gradient(circle at 20% 20%, #263247 0, transparent 32rem),
            #111722;
        }

        main {
          border-color: rgba(255, 255, 255, 0.14);
          background: rgba(19, 27, 40, 0.78);
          box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.24);
        }

        .eyebrow,
        .message {
          color: #b6c0d2;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Academic Portfolio</p>
      <h1>Coming Soon.</h1>
      <p class="message">This site is currently being prepared.</p>
      <p class="message" lang="ko">사이트를 준비하고 있습니다.</p>
    </main>
  </body>
</html>
